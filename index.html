body{margin:0;background:#E9EEEC}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accentText)}a:hover{color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-16px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes scan{0%{top:10%}50%{top:84%}100%{top:10%}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,90,44,.4)}50%{box-shadow:0 0 0 7px rgba(168,90,44,0)}}
@keyframes donut{from{opacity:0;transform:rotate(-120deg) scale(.85)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-6px)}}
.scr{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.item{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.toast{animation:pop .35s cubic-bezier(.2,.9,.3,1.25) both}
.grow{transform-origin:right center;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.donut{animation:donut .9s cubic-bezier(.2,.8,.2,1) both}
.scanline{animation:scan 1.6s ease-in-out infinite}
.badge{animation:pulse 2.2s ease-in-out infinite}
.blink{animation:blink 1.2s ease-in-out infinite}
.floaty{animation:floaty 3.2s ease-in-out infinite}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.cpair{direction:rtl}[dir=ltr] .cpair{justify-content:flex-end}.cpi{direction:rtl;unicode-bidi:isolate}.hs{scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.press{transition:transform .15s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
.press:active{transform:scale(.96)}
.nv{flex:1;max-width:70px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted2);font-size:11px;padding:6px 0 0;position:relative;transition:color .25s ease;min-height:48px}
.nv svg{transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.nv.on{color:var(--accentText);font-weight:600}
.nv.on svg{transform:translateY(-2px)}
.nv .dot{width:5px;height:5px;border-radius:9px;background:var(--accentText);opacity:0;transform:scale(.3);transition:all .3s ease}
.nv.on .dot{opacity:1;transform:scale(1)}
.fab{transition:transform .35s cubic-bezier(.2,.9,.3,1.4),box-shadow .3s ease}
.fab.on{transform:rotate(45deg)}
.seg{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tab{transition:color .25s ease}
.th-green,.th-blue,.th-purple,.th-maroon,.th-sand{--bg:#F2F5F4;--surface:#FFFFFF;--chip:#F2F5F4;--chip2:#F7F9F8;--seg:#E4EAE8;--ink:#17211E;--ink2:#3A4541;--muted:#5C6863;--muted2:#66726D;--line:#E3E8E6;--off:#C9D0CD;--deep:#17211E}
.th-green{--accent:#1F5E4F;--accentText:#1F5E4F;--accentInk:#1F4A3F;--soft:#E1EEE9}
.th-blue{--accent:#24497A;--accentText:#24497A;--accentInk:#1E3A5F;--soft:#E2EAF4}
.th-purple{--accent:#4E3F86;--accentText:#4E3F86;--accentInk:#3E3270;--soft:#ECE8F6}
.th-maroon{--accent:#7A2E3B;--accentText:#7A2E3B;--accentInk:#652632;--soft:#F5E4E7}
.th-sand{--accent:#7E5520;--accentText:#7E5520;--accentInk:#664417;--soft:#F4EBDD}
.dark{--bg:#0F1513;--surface:#19221F;--chip:#222D29;--chip2:#1D2724;--seg:#222D29;--ink:#E7EEEB;--ink2:#C2CDC9;--muted:#95A39E;--muted2:#8C9A95;--line:#2B3733;--off:#3A4743;--deep:#2C3B36}
.th-green.dark{--accentText:#7FD1B3;--accentInk:#BFE3D5;--soft:#1C3A31}
.th-blue.dark{--accent:#2F5C96;--accentText:#8DB4E8;--accentInk:#C9DAF0;--soft:#1C2D45}
.th-purple.dark{--accent:#5E4DA0;--accentText:#B3A5EC;--accentInk:#D8D0F6;--soft:#2A2448}
.th-maroon.dark{--accent:#94394A;--accentText:#EBA1AE;--accentInk:#F4CFD6;--soft:#3F1F26}
.th-sand.dark{--accent:#986828;--accentText:#E3B877;--accentInk:#F1D9B2;--soft:#3A2C17}
@font-face{font-family:'OmrSign';src:url(fonts/OmrSign.woff2) format('woff2');unicode-range:U+20C4;font-display:block}
.thr{background:var(--bg);color:var(--ink);transition:background-color .35s ease,color .35s ease}
.thr button{color:inherit}
.amt{transition:filter .25s ease}
.hide-amt .amt{filter:blur(8px);user-select:none}
.thr input,.thr textarea{background:var(--surface);color:var(--ink)}
.thr input::placeholder,.thr textarea::placeholder{color:var(--muted2)}

@keyframes headsIn{from{opacity:0;transform:translateY(-120%)}to{opacity:1;transform:none}}
.heads{animation:headsIn .45s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes shadeIn{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.shade{animation:shadeIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s ease}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet{animation:sheetUp .38s cubic-bezier(.2,.9,.3,1.05) both}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.tourpop{animation:popIn .4s cubic-bezier(.2,.8,.2,1) both}


html,body{margin:0;height:100%;overflow:hidden;background:#F2F5F4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
input,textarea,select{font-size:16px}
#splash{position:fixed;inset:0;z-index:99;background:#1F5E4F;display:grid;place-items:center;transition:opacity .35s ease}
#splash span{font-family:'OmrSign';font-size:64px;color:#fff}
